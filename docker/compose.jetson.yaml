name: nvcr-jetson

services:
  test:
    image: nvcr-test:orin-nano
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/Dockerfile.jetson
      target: test
    runtime: nvidia
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: all
    network_mode: host
    volumes:
      - ${NVCR_ENGINE_DIR:-../build/engines/dcvcrt}:/opt/nvcr/engines:ro
      - test-build:/test-build

  nvcr:
    image: ${NVCR_JETSON_IMAGE:-nvcr:orin-nano}
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/Dockerfile.jetson
      target: runtime
    runtime: nvidia
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: all
      NVCR_ENGINE_ROOT: /opt/nvcr/engines
    network_mode: host
    user: ${NVCR_HOST_UID:-1000}:${NVCR_HOST_GID:-1000}
    working_dir: /output
    volumes:
      - ${NVCR_ENGINE_ROOT:-../build/engines}:/opt/nvcr/engines:ro
      - ${NVCR_INPUT_DIR:-..}:/input:ro
      - ${NVCR_OUTPUT_DIR:-..}:/output

volumes:
  test-build:
