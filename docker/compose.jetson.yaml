name: nvcr-jetson

services:
  engine-install:
    image: ${NVCR_JETSON_IMAGE:-nvcr:orin-nano}
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/Dockerfile.jetson
      target: runtime
    runtime: nvidia
    entrypoint: ["/opt/nvcr/bin/nvcr-artifacts"]
    command: ["install", "--engine-root", "/opt/nvcr/engines"]
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: all
    network_mode: host
    volumes:
      - engine-assets:/opt/nvcr/engines

  test:
    image: nvcr-test:orin-nano
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/Dockerfile.jetson
      target: test
    runtime: nvidia
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: all
      NVCR_TEST_ENGINE_PROFILE: ${NVCR_TEST_ENGINE_PROFILE:-qcif}
    network_mode: host
    volumes:
      - engine-assets:/opt/nvcr/engines:ro
      - test-build:/test-build

  nvcr:
    image: ${NVCR_JETSON_IMAGE:-nvcr:orin-nano}
    platform: linux/arm64
    build:
      context: ..
      dockerfile: docker/Dockerfile.jetson
      target: runtime
    runtime: nvidia
    environment:
      NVIDIA_DRIVER_CAPABILITIES: compute,utility
      NVIDIA_VISIBLE_DEVICES: all
    network_mode: host
    user: ${NVCR_HOST_UID:-0}:${NVCR_HOST_GID:-0}
    working_dir: /output
    volumes:
      - engine-assets:/opt/nvcr/engines:ro
      - ${NVCR_INPUT_DIR:-..}:/input:ro
      - ${NVCR_OUTPUT_DIR:-..}:/output

volumes:
  engine-assets:
  test-build:
