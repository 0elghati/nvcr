name: upload-engine-assets

on:
  workflow_dispatch:
    inputs:
      asset_release:
        description: Rolling non-semver engine release tag
        required: true
        default: engine-assets
        type: string
      engine_assets:
        description: "Rows: <stable-asset-file-name> <sha256> <staging-download-url>"
        required: true
        type: string

permissions:
  contents: write

jobs:
  upload-engine-assets:
    runs-on: ubuntu-24.04
    env:
      NVCR_ENGINE_ASSET_RELEASE: ${{ inputs.asset_release }}
      NVCR_ENGINE_RELEASE_ASSETS: ${{ inputs.engine_assets }}
    steps:
      - name: Checkout catalog and validation automation
        uses: actions/checkout@v4

      - name: Ensure the rolling engine release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          if ! gh release view "$NVCR_ENGINE_ASSET_RELEASE" >/dev/null 2>&1; then
            gh release create "$NVCR_ENGINE_ASSET_RELEASE" \
              --title "NVCR Engine Assets" \
              --notes "Rolling target-local TensorRT engine catalog. These assets are independent of NVCR application versions."
          fi

      - name: Download the current catalog when present
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nvcr-engine-existing"
          gh release download "$NVCR_ENGINE_ASSET_RELEASE" \
            --pattern nvcr-engine-catalog.json \
            --dir "$RUNNER_TEMP/nvcr-engine-existing" || true

      - name: Validate staged assets and merge the catalog
        run: |
          set -euo pipefail
          existing_catalog=()
          if [[ -f "$RUNNER_TEMP/nvcr-engine-existing/nvcr-engine-catalog.json" ]]; then
            existing_catalog=(--existing-catalog "$RUNNER_TEMP/nvcr-engine-existing/nvcr-engine-catalog.json")
          fi
          python3 scripts/ci/download_engine_release_assets.py \
            --download-dir "$RUNNER_TEMP/nvcr-engine-assets" \
            --extract-dir "$RUNNER_TEMP/nvcr-engine-assets-extract" \
            --summary "$RUNNER_TEMP/nvcr-engine-assets-summary.md" \
            --catalog-output "$RUNNER_TEMP/nvcr-engine-catalog.json" \
            --target-profiles-dir "$PWD/configs/targets" \
            "${existing_catalog[@]}"

      - name: Upload stable archives and checksums
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          mapfile -t upload_files <"$RUNNER_TEMP/nvcr-engine-assets/upload-files.txt"
          gh release upload "$NVCR_ENGINE_ASSET_RELEASE" "${upload_files[@]}" --clobber

      - name: Publish the catalog last
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          gh release upload "$NVCR_ENGINE_ASSET_RELEASE" \
            "$RUNNER_TEMP/nvcr-engine-catalog.json" --clobber

      - name: Write asset summary
        run: cat "$RUNNER_TEMP/nvcr-engine-assets-summary.md" >>"$GITHUB_STEP_SUMMARY"
