name: optional-self-hosted-reference-gpu

# This workflow is an opt-in helper for a specifically labeled self-hosted RTX
# reference runner; it stays manual and disabled by default.
on:
  workflow_dispatch:
    inputs:
      ref:
        description: Git ref to validate on an optional self-hosted RTX runner
        required: false
        default: main

permissions:
  contents: read

concurrency:
  group: optional-self-hosted-reference-gpu
  cancel-in-progress: true

jobs:
  rtx-reference-gate:
    if: ${{ vars.NVCR_ENABLE_SELF_HOSTED_REFERENCE_GATES == 'true' }}
    runs-on:
      - self-hosted
      - nvcr-release-discrete
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.ref }}

      - name: Configure release build on the reference GPU
        run: |
          cmake -S . -B build-main-gpu -DCMAKE_BUILD_TYPE=Release -DNVCR_ENABLE_TENSORRT=ON -DNVCR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build-main-gpu --parallel

      - name: CPU, parser fuzz/boundary, manifest/profile, rANS, and CUDA tests
        run: |
          ctest --test-dir build-main-gpu --output-on-failure -R 'nvcr_(artifact_profiles|engine_catalog|smoke_tests|parser_fuzz_boundaries|rans_conformance|cuda_ops)'

  self-hosted-disabled-summary:
    if: ${{ vars.NVCR_ENABLE_SELF_HOSTED_REFERENCE_GATES != 'true' }}
    runs-on: self-hosted
    steps:
      - name: Explain disabled optional workflow
        run: |
          cat <<'EOF' >>"$GITHUB_STEP_SUMMARY"
          This optional workflow is disabled by default.

          Enable `NVCR_ENABLE_SELF_HOSTED_REFERENCE_GATES=true` only after you add a
          matching `nvcr-release-discrete` self-hosted runner.
          EOF
