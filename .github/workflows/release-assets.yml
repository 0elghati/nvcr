name: release-assets

# Each native runner builds and uploads its own versioned ELF package family.
# The CPU architecture, NVIDIA userspace, CUDA toolchain, and TensorRT ABI are
# part of the package contract; the portable CUDA device-code setting does not
# make x86_64 and AArch64 interchangeable.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag, for example v0.3.0 or v1.0.0
        required: true

permissions:
  contents: write

jobs:
  build-self-hosted-x86_64:
    runs-on: self-hosted
    env:
      NVCR_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Verify exact tagged source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$NVCR_TAG")"
          test "$(cat version.txt)" = "${NVCR_TAG#v}"

      - name: Install minimal CUDA/TensorRT compile dependencies
        run: ./scripts/ci/install_cuda_tensorrt.sh

      - name: Configure self-hosted portable release build
        run: |
          set -euo pipefail
          cmake -S . -B build-release-self-hosted -DCMAKE_BUILD_TYPE=Release -DNVCR_ENABLE_TENSORRT=ON -DNVCR_CUDA_ARCH_SET=portable -DNVCR_FETCH_DEPENDENCIES=ON -DNVCR_BUILD_TESTS=ON

      - name: Build and run portable tests
        run: |
          set -euo pipefail
          cmake --build build-release-self-hosted --parallel
          ctest --test-dir build-release-self-hosted --output-on-failure -R 'nvcr_(artifact_profiles|engine_catalog|smoke_tests|parser_fuzz_boundaries|rans_conformance)'

      - name: Install, package, and verify the generic x86_64 archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nvcr-dist/nvcr-$NVCR_TAG-linux-x86_64-nvidia.tar.gz"
          checksum="$archive.sha256"
          cmake --install build-release-self-hosted --prefix "$RUNNER_TEMP/nvcr-install"
          ./scripts/package_release.sh --version "${NVCR_TAG#v}" --platform linux-x86_64-nvidia --install-prefix "$RUNNER_TEMP/nvcr-install" --output-dir "$RUNNER_TEMP/nvcr-dist"
          test -f "$archive"
          test -f "$checksum"
          (cd "$RUNNER_TEMP/nvcr-dist" && sha256sum -c "$(basename "$checksum")")
          archive_list="$RUNNER_TEMP/nvcr-archive-list.txt"
          tar -tzf "$archive" >"$archive_list"
          grep -qx "nvcr-$NVCR_TAG-linux-x86_64-nvidia/PACKAGE-MANIFEST.sha256" "$archive_list"
          if grep -Eq '(\.plan|\.engine|\.onnx|\.pth(\.tar)?)$|/(i|p)_(entropy|quant)\.bin$|/engine_manifest\.json$|/engine\.sha256$' "$archive_list"; then
            echo "release archive contains forbidden model or engine assets" >&2
            exit 1
          fi

      - name: Upload x86_64 archive to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$NVCR_TAG" "$RUNNER_TEMP/nvcr-dist/nvcr-$NVCR_TAG-linux-x86_64-nvidia.tar.gz" "$RUNNER_TEMP/nvcr-dist/nvcr-$NVCR_TAG-linux-x86_64-nvidia.tar.gz.sha256" --clobber

  build-jetson-aarch64-cross:
    # The NVIDIA JetPack cross image supplies the target sysroot and compiler;
    # no architecture-specific host setup is required on this runner.
    runs-on: self-hosted
    env:
      NVCR_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - uses: docker/setup-buildx-action@v3

      - name: Configure IPv4 BuildKit access to NVIDIA NGC
        run: |
          set -euo pipefail
          builder=nvcr-jetson-ipv4
          docker buildx rm "$builder" >/dev/null 2>&1 || true
          docker buildx create \
            --name "$builder" \
            --driver docker-container \
            --driver-opt network=host \
            --use
          docker buildx inspect "$builder" --bootstrap >/dev/null
          buildkit_container="$(docker ps --filter "name=buildx_buildkit_${builder}" --format '{{.ID}}' | head -n1)"
          test -n "$buildkit_container"
          mapfile -t ngc_ipv4 < <(getent ahostsv4 nvcr.io | awk '{print $1}' | sort -u)
          test "${#ngc_ipv4[@]}" -gt 0
          for address in "${ngc_ipv4[@]}"; do
            docker exec "$buildkit_container" sh -c "grep -q '[[:space:]]nvcr.io$' /etc/hosts || echo '$address nvcr.io' >> /etc/hosts"
          done
          echo "BUILDX_BUILDER=$builder" >>"$GITHUB_ENV"

      - name: Verify exact tagged x86 host source
        run: |
          set -euo pipefail
          test "$(uname -m)" = x86_64
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$NVCR_TAG")"
          test "$(cat version.txt)" = "${NVCR_TAG#v}"

      - name: Build the AArch64 package in NVIDIA's pinned cross image
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/nvcr-dist"
          docker buildx build --builder "$BUILDX_BUILDER" \
            --build-arg "NVCR_VERSION=${NVCR_TAG#v}" \
            --file docker/Dockerfile.jetson-cross \
            --output "type=local,dest=$RUNNER_TEMP/nvcr-dist" \
            .
          archive="$RUNNER_TEMP/nvcr-dist/nvcr-v${NVCR_TAG#v}-linux-aarch64-jetson-l4t36.tar.gz"
          checksum="$archive.sha256"
          test -f "$archive"
          test -f "$checksum"
          (cd "$RUNNER_TEMP/nvcr-dist" && sha256sum -c "$(basename "$checksum")")
          archive_list="$RUNNER_TEMP/nvcr-archive-list.txt"
          tar -tzf "$archive" >"$archive_list"
          grep -qx "nvcr-v${NVCR_TAG#v}-linux-aarch64-jetson-l4t36/PACKAGE-MANIFEST.sha256" "$archive_list"
          if grep -Eq '(\.plan|\.engine|\.onnx|\.pth(\.tar)?)$|/(i|p)_(entropy|quant)\.bin$|/engine_manifest\.json$|/engine\.sha256$' "$archive_list"; then
            echo "release archive contains forbidden model or engine assets" >&2
            exit 1
          fi

      - name: Upload cross-built AArch64 archive to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$NVCR_TAG" "$RUNNER_TEMP/nvcr-dist/nvcr-v${NVCR_TAG#v}-linux-aarch64-jetson-l4t36.tar.gz" "$RUNNER_TEMP/nvcr-dist/nvcr-v${NVCR_TAG#v}-linux-aarch64-jetson-l4t36.tar.gz.sha256" --clobber

  manual-reference-gates:
    needs: [build-self-hosted-x86_64, build-jetson-aarch64-cross]
    runs-on: self-hosted
    steps:
      - name: Record remaining manual gates
        run: |
          cat <<'EOF' >>"$GITHUB_STEP_SUMMARY"
          Draft release remains unpublished until the target-specific gates pass.

          Remaining manual deliverables and gates:
          - run clean-room target validation on the recorded RTX 4070 reference target;
          - run clean-room target validation on the recorded Jetson Orin Nano reference target;
          - record correctness, performance, memory, and energy evidence in `ROADMAP.md`;
          - publish the draft release manually only after the required release-track gates pass.
          EOF
