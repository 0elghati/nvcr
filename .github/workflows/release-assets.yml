name: release-assets

# Release Please creates a draft release and dispatches this workflow. A release
# remains a draft unless the required clean target gates below succeed.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag, for example v0.3.0 or v1.0.0
        required: true
      publish_jetson:
        description: Run the Orin Nano gate for a pre-v1 foundation release
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  build-discrete:
    runs-on:
      - self-hosted
      - nvcr-release-discrete
    env:
      NVCR_TAG: ${{ inputs.tag }}
      NVCR_REFERENCE_ROOT: ${{ vars.NVCR_DCVCRT_ROOT_DISCRETE }}
      NVCR_REFERENCE_PYTHON: ${{ vars.NVCR_DCVCRT_PYTHON_DISCRETE }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify exact tagged source and release inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$NVCR_TAG")"
          test "$(cat version.txt)" = "${NVCR_TAG#v}"
          test -n "$NVCR_REFERENCE_ROOT"
          test -x "$NVCR_REFERENCE_PYTHON"

      - name: Generate and validate the declared RTX 4070 bundle
        run: |
          set -euo pipefail
          ./scripts/nvcr_artifacts.py prepare \
            --model-profile configs/models/dcvcrt-cvpr2025.json \
            --engine-profile configs/engine-profiles/1080p-fp16.json \
            --target-profile configs/targets/rtx4070-ubuntu2404.json \
            --dcvcrt-root "$NVCR_REFERENCE_ROOT" \
            --models "$RUNNER_TEMP/nvcr-models" \
            --engines "$RUNNER_TEMP/nvcr-engines" \
            --python "$NVCR_REFERENCE_PYTHON" \
            --skip-clone
          ./scripts/nvcr_artifacts.py validate "$RUNNER_TEMP/nvcr-models" --json
          ./scripts/nvcr_artifacts.py validate "$RUNNER_TEMP/nvcr-engines" --json

      - name: Release build, full registered suite, and install
        run: |
          set -euo pipefail
          ./scripts/install.sh \
            --build-type Release \
            --build-dir build-release-discrete \
            --prefix "$RUNNER_TEMP/nvcr-install" \
            --run-tests \
            --cmake-arg "-DNVCR_TENSORRT_ENGINE_DIR=$RUNNER_TEMP/nvcr-engines"
          ctest --test-dir build-release-discrete -N

      - name: Package code, docs, profiles, licenses, notices, and manifests
        run: |
          ./scripts/package_release.sh \
            --version "${NVCR_TAG#v}" \
            --platform linux-x86_64-rtx4070 \
            --install-prefix "$RUNNER_TEMP/nvcr-install" \
            --output-dir "$RUNNER_TEMP/nvcr-dist"

      - name: Upload to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$NVCR_TAG" \
            "$RUNNER_TEMP/nvcr-dist/nvcr-$NVCR_TAG-linux-x86_64-rtx4070.tar.gz" \
            "$RUNNER_TEMP/nvcr-dist/nvcr-$NVCR_TAG-linux-x86_64-rtx4070.tar.gz.sha256" \
            --clobber

  build-jetson:
    if: ${{ inputs.publish_jetson || startsWith(inputs.tag, 'v1.') }}
    runs-on:
      - self-hosted
      - nvcr-release-jetson
    env:
      NVCR_TAG: ${{ inputs.tag }}
      NVCR_REFERENCE_ROOT: ${{ vars.NVCR_DCVCRT_ROOT_JETSON }}
      NVCR_REFERENCE_PYTHON: ${{ vars.NVCR_DCVCRT_PYTHON_JETSON }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify exact tagged source and release inputs
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$NVCR_TAG")"
          test "$(cat version.txt)" = "${NVCR_TAG#v}"
          test -n "$NVCR_REFERENCE_ROOT"
          test -x "$NVCR_REFERENCE_PYTHON"

      - name: Generate and validate the declared Orin Nano bundle
        run: |
          set -euo pipefail
          ./scripts/nvcr_artifacts.py prepare \
            --model-profile configs/models/dcvcrt-cvpr2025.json \
            --engine-profile configs/engine-profiles/1080p-fp16.json \
            --target-profile configs/targets/orin-nano-l4t3647.json \
            --dcvcrt-root "$NVCR_REFERENCE_ROOT" \
            --models "$RUNNER_TEMP/nvcr-models" \
            --engines "$RUNNER_TEMP/nvcr-engines" \
            --python "$NVCR_REFERENCE_PYTHON" \
            --skip-clone
          ./scripts/nvcr_artifacts.py validate "$RUNNER_TEMP/nvcr-models" --json
          ./scripts/nvcr_artifacts.py validate "$RUNNER_TEMP/nvcr-engines" --json

      - name: Release build, full registered suite, and install
        run: |
          set -euo pipefail
          ./scripts/install.sh \
            --build-type Release \
            --build-dir build-release-jetson \
            --prefix "$RUNNER_TEMP/nvcr-install" \
            --run-tests \
            --cmake-arg "-DNVCR_TENSORRT_ENGINE_DIR=$RUNNER_TEMP/nvcr-engines"
          ctest --test-dir build-release-jetson -N

      - name: Package code, docs, profiles, licenses, notices, and manifests
        run: |
          ./scripts/package_release.sh \
            --version "${NVCR_TAG#v}" \
            --platform linux-aarch64-orin-nano \
            --install-prefix "$RUNNER_TEMP/nvcr-install" \
            --output-dir "$RUNNER_TEMP/nvcr-dist"

      - name: Upload to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$NVCR_TAG" \
            "$RUNNER_TEMP/nvcr-dist/nvcr-$NVCR_TAG-linux-aarch64-orin-nano.tar.gz" \
            "$RUNNER_TEMP/nvcr-dist/nvcr-$NVCR_TAG-linux-aarch64-orin-nano.tar.gz.sha256" \
            --clobber

  publish-foundation-release:
    needs: [build-discrete, build-jetson]
    if: ${{ always() && !startsWith(inputs.tag, 'v1.') && needs.build-discrete.result == 'success' && (needs.build-jetson.result == 'success' || needs.build-jetson.result == 'skipped') }}
    runs-on: ubuntu-latest
    env:
      NVCR_TAG: ${{ inputs.tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish the RTX-gated pre-v1 release
        run: gh release edit "$NVCR_TAG" --draft=false --repo "${{ github.repository }}"

  publish-v1-release:
    needs: [build-discrete, build-jetson]
    if: ${{ always() && startsWith(inputs.tag, 'v1.') && needs.build-discrete.result == 'success' && needs.build-jetson.result == 'success' }}
    runs-on: ubuntu-latest
    env:
      NVCR_TAG: ${{ inputs.tag }}
      GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - name: Publish only after both v1 target gates pass
        run: gh release edit "$NVCR_TAG" --draft=false --repo "${{ github.repository }}"
