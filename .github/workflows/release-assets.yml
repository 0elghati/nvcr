name: release-assets

# The generic self-hosted runner builds and uploads the x86_64 package family.
# Reference GPU/Jetson environments remain separate requirements for support
# evidence and Jetson packaging, so draft releases stay unpublished until those
# external gates are completed and recorded.
on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag, for example v0.3.0 or v1.0.0
        required: true

permissions:
  contents: write

jobs:
  build-self-hosted-x86_64:
    runs-on: self-hosted
    env:
      NVCR_TAG: ${{ inputs.tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify exact tagged source
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$(git rev-list -n 1 "$NVCR_TAG")"
          test "$(cat version.txt)" = "${NVCR_TAG#v}"

      - name: Install minimal CUDA/TensorRT compile dependencies
        run: ./scripts/ci/install_cuda_tensorrt.sh

      - name: Configure self-hosted portable release build
        run: |
          set -euo pipefail
          cmake -S . -B build-release-self-hosted -DCMAKE_BUILD_TYPE=Release -DNVCR_ENABLE_TENSORRT=ON -DNVCR_CUDA_ARCH_SET=portable -DNVCR_FETCH_DEPENDENCIES=ON -DNVCR_BUILD_TESTS=ON

      - name: Build and run portable tests
        run: |
          set -euo pipefail
          cmake --build build-release-self-hosted --parallel
          ctest --test-dir build-release-self-hosted --output-on-failure -R 'nvcr_(artifact_profiles|engine_catalog|smoke_tests|parser_fuzz_boundaries|rans_conformance)'

      - name: Install, package, and verify the generic x86_64 archive
        run: |
          set -euo pipefail
          archive="$RUNNER_TEMP/nvcr-dist/nvcr-$NVCR_TAG-linux-x86_64-nvidia.tar.gz"
          checksum="$archive.sha256"
          cmake --install build-release-self-hosted --prefix "$RUNNER_TEMP/nvcr-install"
          ./scripts/package_release.sh --version "${NVCR_TAG#v}" --platform linux-x86_64-nvidia --install-prefix "$RUNNER_TEMP/nvcr-install" --output-dir "$RUNNER_TEMP/nvcr-dist"
          test -f "$archive"
          test -f "$checksum"
          (cd "$RUNNER_TEMP/nvcr-dist" && sha256sum -c "$(basename "$checksum")")
          archive_list="$RUNNER_TEMP/nvcr-archive-list.txt"
          tar -tzf "$archive" >"$archive_list"
          grep -qx "nvcr-$NVCR_TAG-linux-x86_64-nvidia/PACKAGE-MANIFEST.sha256" "$archive_list"
          if grep -Eq '(\.plan|\.engine|\.onnx|\.pth(\.tar)?)$|/(i|p)_(entropy|quant)\.bin$|/engine_manifest\.json$|/engine\.sha256$' "$archive_list"; then
            echo "release archive contains forbidden model or engine assets" >&2
            exit 1
          fi

      - name: Upload x86_64 archive to draft release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$NVCR_TAG" "$RUNNER_TEMP/nvcr-dist/nvcr-$NVCR_TAG-linux-x86_64-nvidia.tar.gz" "$RUNNER_TEMP/nvcr-dist/nvcr-$NVCR_TAG-linux-x86_64-nvidia.tar.gz.sha256" --clobber

  manual-reference-gates:
    needs: [build-self-hosted-x86_64]
    runs-on: self-hosted
    steps:
      - name: Record remaining manual gates
        run: |
          cat <<'EOF' >>"$GITHUB_STEP_SUMMARY"
          Draft release remains unpublished until the target-specific gates pass.

          Remaining manual deliverables and gates:
          - run clean-room target validation on the recorded RTX 4070 reference target;
          - run clean-room target validation on the recorded Jetson Orin Nano reference target;
          - build and upload the `linux-aarch64-jetson-l4t36` archive on the validated Jetson target;
          - record correctness, performance, memory, and energy evidence in `ROADMAP.md`;
          - publish the draft release manually only after the required release-track gates pass.
          EOF
