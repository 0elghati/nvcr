name: release-assets

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Release tag to upload assets to, for example v0.1.0
        required: true
      publish_discrete:
        description: Build and upload the x86_64 discrete package
        type: boolean
        default: true
      publish_jetson:
        description: Build and upload the aarch64 Jetson package
        type: boolean
        default: false
      publish_portable:
        description: Build and upload the portable multi-GPU-arch x86_64 package
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build-portable:
    # Hosted runner, no self-hosted GPU hardware required: compiles a single
    # x86_64 binary that targets every GPU architecture in the portable
    # matrix (see NVCR_CUDA_ARCH_SET in cmake/NVCROptions.cmake). This does
    # not run CUDA-executing tests (no GPU on the runner) and does not ship
    # an engine bundle: users still need a per-GPU TensorRT plan, either
    # from a matching engine bundle or built locally (docs/dcvcrt-artifacts.md).
    if: ${{ vars.NVCR_RELEASE_PORTABLE != 'false' && (github.event_name == 'release' || inputs.publish_portable) }}
    runs-on: ubuntu-latest
    env:
      NVCR_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit and TensorRT development packages
        run: ./scripts/ci/install_cuda_tensorrt.sh

      - name: Build and install
        run: |
          ./scripts/install.sh \
            --build-type Release \
            --build-dir build-release-portable \
            --prefix "$RUNNER_TEMP/nvcr-install" \
            --arch-set portable

      - name: Package release archives
        run: |
          ./scripts/package_release.sh \
            --version "${NVCR_TAG#v}" \
            --platform linux-x86_64-portable \
            --install-prefix "$RUNNER_TEMP/nvcr-install" \
            --output-dir "$RUNNER_TEMP/nvcr-dist"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$NVCR_TAG" "$RUNNER_TEMP"/nvcr-dist/* --clobber

  build-discrete:
    if: ${{ vars.NVCR_RELEASE_DISCRETE == 'true' && (github.event_name == 'release' || inputs.publish_discrete) }}
    runs-on:
      - self-hosted
      - nvcr-release-discrete
    env:
      NVCR_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and install
        run: |
          ./scripts/install.sh \
            --build-type Release \
            --build-dir build-release-discrete \
            --prefix "$RUNNER_TEMP/nvcr-install" \
            --run-tests

      - name: Build local engine bundle when checkpoints are configured
        if: ${{ vars.NVCR_DCVCRT_ROOT_DISCRETE != '' && vars.NVCR_DCVCRT_PYTHON_DISCRETE != '' }}
        run: |
          ./scripts/prepare_dcvcrt_artifacts.sh \
            --dcvcrt-root "${{ vars.NVCR_DCVCRT_ROOT_DISCRETE }}" \
            --models build/models/dcvcrt \
            --engines "$RUNNER_TEMP/nvcr-engines/dcvcrt" \
            --python "${{ vars.NVCR_DCVCRT_PYTHON_DISCRETE }}" \
            --trtexec /usr/src/tensorrt/bin/trtexec \
            --skip-clone --skip-smoke

      - name: Package release archives
        run: |
          engine_args=()
          if [[ -d "$RUNNER_TEMP/nvcr-engines/dcvcrt" ]]; then
            engine_args+=(--engine-dir "$RUNNER_TEMP/nvcr-engines/dcvcrt")
          fi
          ./scripts/package_release.sh \
            --version "${NVCR_TAG#v}" \
            --platform linux-x86_64-discrete \
            --install-prefix "$RUNNER_TEMP/nvcr-install" \
            --output-dir "$RUNNER_TEMP/nvcr-dist" \
            "${engine_args[@]}"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$NVCR_TAG" "$RUNNER_TEMP"/nvcr-dist/* --clobber

  build-jetson:
    if: ${{ vars.NVCR_RELEASE_JETSON == 'true' && (github.event_name == 'release' || inputs.publish_jetson) }}
    runs-on:
      - self-hosted
      - nvcr-release-jetson
    env:
      NVCR_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Build and install
        run: |
          ./scripts/install.sh \
            --build-type Release \
            --build-dir build-release-jetson \
            --prefix "$RUNNER_TEMP/nvcr-install" \
            --run-tests

      - name: Build local engine bundle when checkpoints are configured
        if: ${{ vars.NVCR_DCVCRT_ROOT_JETSON != '' && vars.NVCR_DCVCRT_PYTHON_JETSON != '' }}
        run: |
          ./scripts/prepare_dcvcrt_artifacts.sh \
            --dcvcrt-root "${{ vars.NVCR_DCVCRT_ROOT_JETSON }}" \
            --models build/models/dcvcrt \
            --engines "$RUNNER_TEMP/nvcr-engines/dcvcrt" \
            --python "${{ vars.NVCR_DCVCRT_PYTHON_JETSON }}" \
            --trtexec /usr/src/tensorrt/bin/trtexec \
            --skip-clone --skip-smoke

      - name: Package release archives
        run: |
          engine_args=()
          if [[ -d "$RUNNER_TEMP/nvcr-engines/dcvcrt" ]]; then
            engine_args+=(--engine-dir "$RUNNER_TEMP/nvcr-engines/dcvcrt")
          fi
          ./scripts/package_release.sh \
            --version "${NVCR_TAG#v}" \
            --platform linux-aarch64-jetson \
            --install-prefix "$RUNNER_TEMP/nvcr-install" \
            --output-dir "$RUNNER_TEMP/nvcr-dist" \
            "${engine_args[@]}"

      - name: Upload release assets
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release upload "$NVCR_TAG" "$RUNNER_TEMP"/nvcr-dist/* --clobber