name: release-please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  issues: write
  pull-requests: write
  actions: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - id: release
        uses: googleapis/release-please-action@v4
        with:
          token: ${{ secrets.RELEASE_PLEASE_TOKEN != '' && secrets.RELEASE_PLEASE_TOKEN || secrets.GITHUB_TOKEN }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

      # GitHub API-created draft releases do not trigger downstream workflows,
      # so dispatch `release-assets.yml` directly when a release is created.
      - name: Trigger release asset builds
        if: ${{ steps.release.outputs.release_created == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Request Jetson assets only when the repository variable enables them.
          gh workflow run release-assets.yml \
            --repo "${{ github.repository }}" \
            --ref main \
            -f tag="${{ steps.release.outputs.tag_name }}" \
            -f publish_jetson="${{ vars.NVCR_RELEASE_JETSON == 'true' && 'true' || 'false' }}" \
