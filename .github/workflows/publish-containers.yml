name: publish-containers

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag, for example v0.18.0
        required: true
        type: string
      architecture:
        description: Runtime image family to publish
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - jetson
          - all

permissions:
  contents: read

env:
  NVCR_TAG: ${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}

concurrency:
  group: publish-containers-${{ github.event_name == 'release' && github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-x86_64:
    if: ${{ github.event_name == 'release' || inputs.architecture == 'x86_64' || inputs.architecture == 'all' }}
    runs-on: [self-hosted, Linux, X64]
    env:
      NVCR_DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/nvcr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NVCR_TAG }}
          fetch-depth: 0

      - name: Verify release source
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match HEAD)" = "$NVCR_TAG"
          test "$(cat version.txt)" = "${NVCR_TAG#v}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish x86_64 runtime
        run: ./docker/publish.sh --push amd64-cuda12.8-trt10.9

  publish-jetson:
    if: ${{ github.event_name == 'release' || inputs.architecture == 'jetson' || inputs.architecture == 'all' }}
    runs-on: [self-hosted, Linux, ARM64, Jetson]
    env:
      NVCR_DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/nvcr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.NVCR_TAG }}
          fetch-depth: 0

      - name: Verify release source and native target
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git describe --tags --exact-match HEAD)" = "$NVCR_TAG"
          test "$(cat version.txt)" = "${NVCR_TAG#v}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Jetson runtime
        run: ./docker/publish.sh --push jetson
