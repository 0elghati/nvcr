name: publish-containers

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Exact release tag, for example v0.5.1
        required: true
        type: string
      architecture:
        description: Runtime image family to publish
        required: true
        default: x86_64
        type: choice
        options:
          - x86_64
          - jetson
          - all

permissions:
  contents: read

concurrency:
  group: publish-containers-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  publish-x86_64:
    if: ${{ inputs.architecture == 'x86_64' || inputs.architecture == 'all' }}
    runs-on: self-hosted
    env:
      NVCR_TAG: ${{ inputs.tag }}
      NVCR_DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/nvcr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify release source
        run: |
          set -euo pipefail
          test "$(git describe --tags --exact-match HEAD)" = "$NVCR_TAG"
          test "$(cat version.txt)" = "${NVCR_TAG#v}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish x86_64 runtime
        run: ./docker/publish.sh --push x86_64

  publish-jetson:
    if: ${{ inputs.architecture == 'jetson' || inputs.architecture == 'all' }}
    runs-on: [self-hosted, Linux, ARM64, jetson]
    env:
      NVCR_TAG: ${{ inputs.tag }}
      NVCR_DOCKERHUB_REPOSITORY: ${{ secrets.DOCKERHUB_USERNAME }}/nvcr
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}
          fetch-depth: 0

      - name: Verify release source and native target
        run: |
          set -euo pipefail
          test "$(uname -m)" = aarch64
          test "$(git describe --tags --exact-match HEAD)" = "$NVCR_TAG"
          test "$(cat version.txt)" = "${NVCR_TAG#v}"

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Build and publish Jetson runtime
        run: ./docker/publish.sh --push jetson
