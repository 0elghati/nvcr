name: ci

# PR validation runs only on GitHub-hosted runners.
# Self-hosted GPU runners stay off `pull_request`; trusted GPU execution remains
# in `release-assets.yml` and `trusted-main-gpu`.
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    # Skip compile jobs when a change cannot affect compiled output.
    runs-on: ubuntu-latest
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cpp:
              - 'CMakeLists.txt'
              - 'cmake/**'
              - 'configs/**'
              - 'resources/**'
              - 'src/**'
              - 'include/**'
              - 'cli/**'
              - 'tests/**'
              - 'benchmarks/**'
              - 'examples/**'
              - 'third_party/**'
              - 'tools/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'

  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Shell syntax and shellcheck
        run: |
          set -euo pipefail
          shopt -s globstar
          for f in scripts/**/*.sh; do
            echo "== $f =="
            bash -n "$f"
          done
          shellcheck scripts/*.sh scripts/ci/*.sh

      - name: Python syntax check
        run: |
          set -euo pipefail
          shopt -s nullglob
          for f in scripts/*.py tests/*.py; do
            echo "== $f =="
            python3 -m py_compile "$f"
          done

      - name: Validate release-please JSON config
        run: |
          python3 -m json.tool release-please-config.json >/dev/null
          python3 -m json.tool .release-please-manifest.json >/dev/null

  build-cpu:
    # CPU-only coverage for the shipped host CPU architectures.
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, ubuntu-24.04-arm]
        build_type: [Debug, Release]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DNVCR_ENABLE_TENSORRT=OFF \
            -DNVCR_FETCH_DEPENDENCIES=ON \
            -DNVCR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-cuda-portable:
    # Compile-only CUDA/TensorRT coverage for the portable GPU-architecture
    # matrix. Hosted runners have no GPU, so this job does not run CUDA tests.
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - uses: actions/checkout@v4

      - name: Install CUDA toolkit and TensorRT development packages
        run: ./scripts/ci/install_cuda_tensorrt.sh

      - name: Configure (portable multi-arch)
        run: |
          cmake -S . -B build-portable \
            -DCMAKE_BUILD_TYPE=Release \
            -DNVCR_ENABLE_TENSORRT=ON \
            -DNVCR_CUDA_ARCH_SET=portable \
            -DNVCR_FETCH_DEPENDENCIES=ON \
            -DNVCR_BUILD_TESTS=ON

      - name: Build (compile-check only, no GPU present)
        run: cmake --build build-portable --parallel
