name: ci

# PR validation runs on repository-managed self-hosted infrastructure.
# Reference-target GPU/Jetson validation remains separately gated because it
# requires specifically labeled hardware.
on:
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: read

jobs:
  changes:
    # Skip heavier jobs when a change cannot affect compiled or release-packaged output.
    runs-on: self-hosted
    outputs:
      cpp: ${{ steps.filter.outputs.cpp }}
      release_surface: ${{ steps.filter.outputs.release_surface }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            cpp:
              - 'CMakeLists.txt'
              - 'cmake/**'
              - 'configs/**'
              - 'resources/**'
              - 'src/**'
              - 'include/**'
              - 'cli/**'
              - 'tests/**'
              - 'benchmarks/**'
              - 'examples/**'
              - 'third_party/**'
              - 'tools/**'
              - 'docker/**'
              - 'cmake/toolchains/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
            release_surface:
              - 'CMakeLists.txt'
              - 'cmake/**'
              - 'configs/**'
              - 'resources/**'
              - 'src/**'
              - 'include/**'
              - 'cli/**'
              - 'tests/**'
              - 'benchmarks/**'
              - 'examples/**'
              - 'third_party/**'
              - 'tools/**'
              - 'docker/**'
              - 'cmake/toolchains/**'
              - 'scripts/**'
              - '.github/workflows/ci.yml'
              - '.github/workflows/release-assets.yml'
              - '.github/workflows/upload-engine-assets.yml'

  lint:
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install lint dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-yaml shellcheck

      - name: Shell syntax and shellcheck
        run: |
          set -euo pipefail
          shopt -s globstar
          for f in scripts/**/*.sh; do
            echo "== $f =="
            bash -n "$f"
          done
          find scripts -name '*.sh' -print0 | xargs -0 shellcheck

      - name: Python syntax check
        run: |
          set -euo pipefail
          shopt -s globstar nullglob
          for f in scripts/**/*.py tests/*.py; do
            echo "== $f =="
            python3 -m py_compile "$f"
          done

      - name: Validate release-please JSON config
        run: |
          python3 -m json.tool release-please-config.json >/dev/null
          python3 -m json.tool .release-please-manifest.json >/dev/null

      - name: Validate workflow YAML
        run: |
          python3 -c "from pathlib import Path; import yaml; [yaml.safe_load(path.read_text(encoding='utf-8')) for path in sorted(Path('.github/workflows').glob('*.yml'))]"

  build-cpu:
    # Release-only CPU coverage for the self-hosted runner's native architecture.
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: |
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=Release \
            -DNVCR_ENABLE_TENSORRT=OFF \
            -DNVCR_FETCH_DEPENDENCIES=ON \
            -DNVCR_BUILD_TESTS=ON

      - name: Build
        run: cmake --build build --parallel

      - name: Test
        run: ctest --test-dir build --output-on-failure

  build-sanitized:
    # Core-only sanitizer coverage for format parsers and contract suites.
    needs: changes
    if: needs.changes.outputs.cpp == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install Clang
        run: sudo apt-get update && sudo apt-get install -y clang

      - name: Configure (Clang ASan/UBSan and libFuzzer)
        env:
          CC: clang
          CXX: clang++
        run: |
          cmake -S . -B build-sanitized \
            -DCMAKE_BUILD_TYPE=Debug \
            -DNVCR_ENABLE_TENSORRT=OFF \
            -DNVCR_ENABLE_SANITIZERS=ON \
            -DNVCR_ENABLE_FUZZING=ON \
            -DNVCR_BUILD_TESTS=ON \
            -DNVCR_BUILD_CLI=OFF

      - name: Build
        run: cmake --build build-sanitized --parallel

      - name: Test
        run: ctest --test-dir build-sanitized --output-on-failure

      - name: Bounded parser fuzz run
        run: |
          ./build-sanitized/tests/nvcr_access_unit_fuzz \
            -runs=1000 \
            -timeout=5 \
            -max_total_time=10

  build-cuda-portable:
    # Self-hosted CUDA/TensorRT build plus generic x86_64 packaging smoke coverage.
    # This is a required PR gate for release-surface changes.
    # Target GPU execution remains in the separately labeled GPU workflow.
    needs: changes
    if: needs.changes.outputs.release_surface == 'true'
    runs-on: self-hosted
    steps:
      - uses: actions/checkout@v4

      - name: Install minimal CUDA/TensorRT compile dependencies
        run: ./scripts/ci/install_cuda_tensorrt.sh

      - name: Configure (portable multi-arch)
        run: |
          cmake -S . -B build-portable \
            -DCMAKE_BUILD_TYPE=Release \
            -DNVCR_ENABLE_TENSORRT=ON \
            -DNVCR_CUDA_ARCH_SET=portable \
            -DNVCR_FETCH_DEPENDENCIES=ON \
            -DNVCR_BUILD_TESTS=ON

      - name: Build (compile/package check only)
        run: cmake --build build-portable --parallel

      - name: Install and smoke-package the generic x86_64 archive
        run: |
          set -euo pipefail
          version="$(cat version.txt)"
          archive="$RUNNER_TEMP/nvcr-dist/nvcr-v$version-linux-x86_64-nvidia.tar.gz"
          checksum="$archive.sha256"
          cmake --install build-portable --prefix "$RUNNER_TEMP/nvcr-install"
          ./scripts/package_release.sh \
            --version "$version" \
            --platform linux-x86_64-nvidia \
            --install-prefix "$RUNNER_TEMP/nvcr-install" \
            --output-dir "$RUNNER_TEMP/nvcr-dist"
          test -f "$archive"
          test -f "$checksum"
          (cd "$RUNNER_TEMP/nvcr-dist" && sha256sum -c "$(basename "$checksum")")
          archive_list="$RUNNER_TEMP/nvcr-archive-list.txt"
          tar -tzf "$archive" >"$archive_list"
          grep -qx "nvcr-v$version-linux-x86_64-nvidia/PACKAGE-MANIFEST.sha256" "$archive_list"
          if grep -Eq '(\.plan|\.engine|\.onnx|\.pth(\.tar)?)$|/(i|p)_(entropy|quant)\.bin$|/engine_manifest\.json$|/engine\.sha256$' "$archive_list"; then
            echo "release archive contains forbidden model or engine assets" >&2
            exit 1
          fi
